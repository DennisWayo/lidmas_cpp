name: ci

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y cmake g++ make
      - name: Configure
        run: cmake -S . -B build
      - name: Build
        run: cmake --build build --target lidmas -j
      - name: Selftest
        run: ./build/lidmas --selftest
